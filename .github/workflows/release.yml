name: Validate and publish package

on:
  pull_request:
  push:
    branches: [main]
    tags: ['0.*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and zip package
        shell: python
        run: |
          import json, os, re, zipfile
          from pathlib import Path

          root = Path('.')
          manifest = json.loads(Path('package.json').read_text())
          version = manifest['version']
          if os.environ['GITHUB_REF_TYPE'] == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == version, 'Tag must match package version'

          def hidden(path):
              return any(part.startswith('.') or part == 'dist' for part in path.parts)

          files = [p for p in sorted(root.rglob('*')) if p.is_file() and not hidden(p)]
          guids = set()
          for path in files:
              if path.suffix == '.meta':
                  match = re.search(r'^guid: ([0-9a-f]{32})$', path.read_text(), re.M)
                  assert match and match[1] not in guids, f'Missing or duplicate GUID: {path}'
                  guids.add(match[1])
              elif not any(part.endswith('~') and part != path.name for part in path.parts[:-1]):
                  assert Path(str(path) + '.meta').is_file(), f'Missing metadata: {path}.meta'

          archive = Path('dist') / f"{manifest['name']}-{version}.zip"
          archive.parent.mkdir(exist_ok=True)
          with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED) as package:
              for path in files:
                  package.write(path, path.as_posix())
          Path('dist/package.json').write_bytes(Path('package.json').read_bytes())
      - uses: actions/upload-artifact@v4
        with:
          name: vpm-package
          path: dist/

  release:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vpm-package
          path: dist
      - name: Publish validated release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.zip dist/package.json --verify-tag --title "$RELEASE_TAG" --generate-notes
